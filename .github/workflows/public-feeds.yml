name: Public disaster and precipitation feeds
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '3 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/public-feeds.yml', 'scripts/public_feeds.py']

permissions: {}
concurrency:
  group: public-feed-publisher
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        feed: ${{ fromJSON(github.event_name != 'schedule' && '["disasters","weather"]' || github.event.schedule == '3 * * * *' && '["weather"]' || '["disasters"]') }}
    uses: ./.github/workflows/collect-and-publish-feed.yml
    with:
      feed: ${{ matrix.feed }}
