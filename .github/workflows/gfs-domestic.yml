name: Domestic GFS rainfall forecasts
on:
  schedule:
    - cron: '35 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/gfs_domestic.py', '.github/workflows/gfs-domestic.yml']
permissions: {}
concurrency:
  group: domestic-gfs-forecast
  cancel-in-progress: false
jobs:
  forecast:
    permissions:
      contents: write
    uses: ./.github/workflows/collect-and-publish-feed.yml
    with:
      feed: gfs-domestic
    secrets:
      points: ${{ secrets.WEATHER_POINTS_JSON }}
