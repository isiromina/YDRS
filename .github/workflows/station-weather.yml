name: KMA observations and WeatherAPI forecasts
on:
  schedule:
    - cron: '0 * * * *' # Both feeds once an hour
    - cron: '10,20,30,40,50 * * * *' # Additional KMA observations
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/station-weather.yml', 'scripts/station_weather.py']

permissions: {}
concurrency:
  group: station-weather-publisher
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        feed: ${{ fromJSON(github.event.schedule == '10,20,30,40,50 * * * *' && '["kma-aws"]' || '["kma-aws","weatherapi"]') }}
    uses: ./.github/workflows/collect-and-publish-feed.yml
    with:
      feed: ${{ matrix.feed }}
    secrets:
      kma_key: ${{ matrix.feed == 'kma-aws' && secrets.KMA_API_KEY || '' }}
      weather_key: ${{ matrix.feed == 'weatherapi' && secrets.WEATHERAPI_KEY || '' }}
      points: ${{ matrix.feed == 'weatherapi' && secrets.WEATHER_POINTS_JSON || '' }}
