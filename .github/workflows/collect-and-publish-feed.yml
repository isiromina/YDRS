name: Collect and publish one precipitation or disaster feed
on:
  workflow_call:
    inputs:
      feed:
        required: true
        type: string
    secrets:
      kma_key:
        required: false
      weather_key:
        required: false
      points:
        required: false

permissions: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /feeds/weatherapi.json
      - name: Install GRIB reader
        if: inputs.feed == 'weather'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes-tools
      - name: Install point forecast reader
        if: inputs.feed == 'gfs-domestic'
        run: python3 -m pip install 'eccodes==2.44.0'
      - name: Collect feed
        env:
          FEED: ${{ inputs.feed }}
          KMA_KEY: ${{ secrets.kma_key }}
          WEATHER_KEY: ${{ secrets.weather_key }}
          WEATHER_POINTS: ${{ secrets.points }}
        run: |
          case "$FEED" in
            kma-aws|weatherapi) python3 scripts/station_weather.py "$FEED" ;;
            gfs-domestic) python3 scripts/gfs_domestic.py ;;
            kma-forecast) python3 scripts/kma_forecast.py ;;
            disasters|weather) python3 scripts/public_feeds.py "$FEED" ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snapshot-${{ inputs.feed }}
          path: output/${{ inputs.feed }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snapshot-${{ inputs.feed }}
          path: output
      - name: Publish validated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          FEED: ${{ inputs.feed }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/contents/feeds/$FEED.json"
          if ! gh api "$endpoint?ref=main" > "$RUNNER_TEMP/current.json" 2>"$RUNNER_TEMP/status"; then
            grep -q 'HTTP 404' "$RUNNER_TEMP/status" || exit 1
            echo '{}' > "$RUNNER_TEMP/current.json"
          fi
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          feed = os.environ["FEED"]
          tmp = Path(os.environ["RUNNER_TEMP"])
          current = json.loads((tmp / "current.json").read_text())
          data = Path(f"output/{feed}.json").read_bytes()
          if len(data) > 950000:
              raise SystemExit("Snapshot exceeds pilot size limit")
          args = dict(message=f"Refresh public {feed} feed", branch="main",
                      content=base64.b64encode(data).decode())
          if current:
              old = json.loads(base64.b64decode(current["content"]))
              new = json.loads(data)
              if old["collected_at"] >= new["collected_at"]:
                  raise SystemExit("Refusing to replace newer snapshot")
              args["sha"] = current["sha"]
          (tmp / "request.json").write_text(json.dumps(args))
          PY
          gh api --silent -X PUT "$endpoint" --input "$RUNNER_TEMP/request.json"
